# IC-Flow Platform API 服务
apiVersion: v1
kind: Service
metadata:
  name: icflow-api
  namespace: icflow
  labels:
    app: icflow
    component: api
spec:
  type: ClusterIP
  ports:
  - port: 8000
    targetPort: http
    protocol: TCP
    name: http
  selector:
    app: icflow
    component: api
---
# Redis 消息总线服务
apiVersion: v1
kind: Service
metadata:
  name: icflow-redis
  namespace: icflow
  labels:
    app: icflow
    component: redis
spec:
  ports:
  - port: 6379
    targetPort: 6379
    protocol: TCP
    name: redis
  selector:
    app: icflow
    component: redis
---
# PostgreSQL 知识库服务
apiVersion: v1
kind: Service
metadata:
  name: icflow-postgres
  namespace: icflow
  labels:
    app: icflow
    component: postgres
spec:
  ports:
  - port: 5432
    targetPort: 5432
    protocol: TCP
    name: postgres
  selector:
    app: icflow
    component: postgres
